plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository { maven { url = "https://maven.squiddev.cc" } }
        filter { includeGroup("cc.tweaked") }
    }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate

    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    exclusiveContent { // RyanHCode Maven (Sable, Aeronautics, Simulated)
        forRepositories(mavenLocal(), maven {
            url = "https://maven.ryanhcode.dev/releases"
            name = "RyanHCode Maven"
        })
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
            includeGroup("dev.eriksonn.aeronautics")
            includeGroup("dev.simulated_team.simulated")
        }
    }

    maven { // ForgeConfigApiPort (Sable transitive dep)
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        name = "Fuzs Mod Resources"
    }

    maven { // Curios API (Aeronautics transitive dep)
        url = "https://maven.theillusivec4.top/"
        name = "TheIllusiveC4 Maven"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "dev.ryanhcode.sable-companion"
                && details.requested.name == "sable-companion-common-${project.minecraft_version}") {
            details.useVersion "1.6.0"
            details.because "Sable declares an open companion version range; pin it for deterministic local builds."
        }
    }
}

neoForge {
    version = project.neo_version

    // Access transformers are detected automatically when the file exists.
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs registered gametests and exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Keep registry event output visible in local development.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (project.hasProperty('transportChecks')) sourceSet(sourceSets.test)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Standalone regression checks share the mapped Minecraft classes used by the mod.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

def regressionChecks = [
    checkNozzleDyeBudget: 'com.mikoalopex.createfirefightingadd.content.fluids.nozzle.NozzleDyeBudgetTest',
    checkFlowMeterApi: 'com.mikoalopex.createfirefightingadd.content.blocks.flow_meter.FlowMeterApiTest',
    checkMultipurposeBacktank: 'com.mikoalopex.createfirefightingadd.content.equipment.backtank.MultipurposeBacktankTest',
    checkCopycatHoseRoute: 'com.mikoalopex.createfirefightingadd.content.blocks.fire_hose.CopycatHoseRouteTest',
    checkCopycatHoseUv: 'com.mikoalopex.createfirefightingadd.content.blocks.fire_hose.CopycatHoseUvTest',
    checkFireHoseSizes: 'com.mikoalopex.createfirefightingadd.content.blocks.fire_hose.FireHoseSizesTest',
    checkHoseRelayCompatibility: 'com.mikoalopex.createfirefightingadd.compatibility.HoseRelayCompatibilityTest',
    checkHoseTexture: 'com.mikoalopex.createfirefightingadd.content.blocks.fire_hose.HoseTextureTest',
    checkCompatibility: 'com.mikoalopex.createfirefightingadd.compatibility.CompatibilityRulesTest',
    checkNozzleOrientation: 'com.mikoalopex.createfirefightingadd.content.fluids.nozzle.NozzleOrientationTest',
    checkCreativeSectionLayout: 'com.mikoalopex.createfirefightingadd.client.CreativeSectionLayoutTest',
]
regressionChecks.each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = 'Runs standalone regression checks without launching Minecraft.'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entryPoint
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
}
tasks.named('check') { dependsOn regressionChecks.keySet() }

tasks.register('checkFlowMeterIntegrations', JavaExec) {
    group = 'verification'
    description = 'Checks optional flow meter adapters against the CC and Synaxis APIs.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    if (project.hasProperty('flowMeterSynaxisJar')) {
        classpath = classpath.filter { !it.name.startsWith('synaxis-') } + files(project.property('flowMeterSynaxisJar'))
    }
    mainClass = 'com.mikoalopex.createfirefightingadd.content.blocks.flow_meter.FlowMeterIntegrationsTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('checkFlowMeterIntegrations') }

[
    checkNozzleColoringIndex: 'com.mikoalopex.createfirefightingadd.integration.dragonsplus.NozzleColoringIndexTest',
    checkNozzleSpecialColoring: 'com.mikoalopex.createfirefightingadd.integration.dragonsplus.NozzleSpecialColoringTest',
    checkDragonsPlusColoring: 'com.mikoalopex.createfirefightingadd.integration.dragonsplus.DragonsPlusColoringTest',
].each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = 'Checks nozzle coloring against the current Dragons Plus API without launching Minecraft.'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
        mainClass = entryPoint
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    tasks.named('check') { dependsOn tasks.named(taskName) }
}


dependencies {
    compileOnly("maven.modrinth:create-dragons-plus:EAW88SvH") { transitive = false } // Dragons Plus 1.11.0
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:1.118.0") { transitive = false }
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-core-api:1.118.0") { transitive = false }
    compileOnly("maven.modrinth:synaxis:RFBeUM47") { transitive = false } // Synaxis 1.5.0
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    compileOnly files("libs/jade-15.10.5.jar")

    compileOnly("dev.ryanhcode.sable:sable-neoforge-${project.minecraft_version}:${project.sable_version}")

}

// Expand mod metadata templates from gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
